[project]
name = "tollgate"
version = "0.14.3"
description = "Let AI write your code, and merge only what works: tests are written first, the AI cannot change them, and a change reaches main only when a program on your machine sees them pass."
requires-python = ">=3.11"
license = "Apache-2.0"

[tool.ruff]
target-version = "py311"
line-length = 100
